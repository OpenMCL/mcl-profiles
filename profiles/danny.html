<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陳品翰 | 個人頁面</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/styles.css">

  <style>
    /* ===== 個人頁面整體 ===== */
    .profile-page {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #0f172a, #1e293b, #172554);
      color: #f8fafc;
      font-family: "Noto Sans TC", sans-serif;
    }

    /* ===== 返回首頁按鈕 ===== */
    .back-btn {
      display: inline-block;
      padding: 10px 18px;
      margin-bottom: 45px;
      color: #cbd5e1;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }

    .back-btn:hover {
      color: white;
      background: #3b82f6;
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    /* ===== 個人資料區 ===== */
    .profile-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      max-width: 700px;
      margin: 0 auto 50px;
      padding: 35px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(15px);
    }

    .avatar {
      width: 150px;
      height: 150px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(96, 165, 250, 0.8);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
      transition: transform 0.4s;
    }

    .avatar:hover {
      transform: scale(1.06) rotate(3deg);
    }

    .profile-info h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .profile-info p {
      margin: 0;
      color: #94a3b8;
      font-size: 1rem;
      letter-spacing: 3px;
    }

    .profile-info p::before {
      content: "STUDENT / DEVELOPER";
      display: block;
      margin-bottom: 10px;
      color: #60a5fa;
      font-size: 0.7rem;
      letter-spacing: 2px;
    }

    /* ===== 新的小功能：今日工程師狀態 ===== */
    .useless-box {
      max-width: 620px;
      margin: 0 auto;
      padding: 30px;
      text-align: center;
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.75);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s, transform 0.3s;
    }

    .useless-box:hover {
      border-color: rgba(96, 165, 250, 0.6);
      transform: translateY(-4px);
    }

    .useless-box h4 {
      margin: 0 0 8px;
      color: #93c5fd;
      font-size: 1.25rem;
      letter-spacing: 1px;
    }

    .status-subtitle {
      margin-bottom: 25px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* 狀態顯示卡片 */
    .status-card {
      padding: 25px 15px;
      margin-bottom: 25px;
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(59, 130, 246, 0.12),
        rgba(139, 92, 246, 0.12)
      );
      border: 1px solid rgba(147, 197, 253, 0.15);
    }

    .status-emoji {
      display: block;
      margin-bottom: 12px;
      font-size: 3rem;
      animation: float 2.5s ease-in-out infinite;
    }

    .status-text {
      color: #f1f5f9;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-label {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 12px;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.12);
      border-radius: 20px;
      font-size: 0.75rem;
    }

    /* 切換狀態按鈕 */
    .boring-btn {
      padding: 12px 24px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(59, 130, 246, 0.2);
      transition: 0.3s;
    }

    .boring-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }

    .boring-btn:active {
      transform: scale(0.97);
    }

    /* 狀態切換動畫 */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    /* ===== 手機版調整 ===== */
    @media (max-width: 600px) {
      .profile-page {
        padding: 25px 16px;
      }

      .back-btn {
        margin-bottom: 30px;
      }

      .profile-header {
        flex-direction: column;
        gap: 20px;
        padding: 30px 20px;
        text-align: center;
      }

      .avatar {
        width: 125px;
        height: 125px;
      }

      .profile-info h1 {
        font-size: 2rem;
      }

      .profile-info p {
        font-size: 0.9rem;
      }

      .useless-box {
        padding: 25px 18px;
      }

      .status-text {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body class="profile-page">

  <a href="../index.html" class="back-btn">← 回到首頁</a>

  <!-- 個人資料 -->
  <header class="profile-header">
    <img
      class="avatar"
      src="../assets/photos/good.jpg"
      alt="陳品翰的頭像"
    >

    <div class="profile-info">
      <h1>陳品翰</h1>
      <p>游博森</p>
    </div>
  </header>

  <!-- 新功能：今日工程師狀態 -->
  <section class="useless-box">

    <h4>💻 今日工程師狀態</h4>
    <p class="status-subtitle">
      程式可以不會寫，但氣勢不能輸。
    </p>

    <div class="status-card">
      <span class="status-emoji" id="statusEmoji">🤔</span>

      <div class="status-text" id="statusText">
        正在假裝看懂程式碼
      </div>

      <span class="status-label" id="statusLabel">
        DEBUG MODE
      </span>
    </div>

    <button class="boring-btn" onclick="changeStatus()">
      🔄 切換今日狀態
    </button>

  </section>

  <script>
    const engineerStatuses = [
      {
        emoji: "🤔",
        text: "正在假裝看懂程式碼",
        label: "DEBUG MODE"
      },
      {
        emoji: "☕",
        text: "咖啡喝完，程式還沒寫完",
        label: "COFFEE MODE"
      },
      {
        emoji: "🐛",
        text: "修好一個 Bug，新增三個 Bug",
        label: "BUG CREATOR"
      },
      {
        emoji: "🔥",
        text: "程式能跑就先不要動",
        label: "DO NOT TOUCH"
      },
      {
        emoji: "😎",
        text: "今天也是技術力爆棚的一天",
        label: "PRO MODE"
      },
      {
        emoji: "💀",
        text: "為什麼昨天能跑，今天不行？",
        label: "HELP ME"
      },
      {
        emoji: "🛌",
        text: "人還在，靈魂已經下班",
        label: "AFK MODE"
      },
      {
        emoji: "🚀",
        text: "寫程式五分鐘，找 Bug 兩小時",
        label: "MISSION IMPOSSIBLE"
      }
    ];

    let previousIndex = -1;

    function changeStatus() {
      let randomIndex;

      do {
        randomIndex = Math.floor(
          Math.random() * engineerStatuses.length
        );
      } while (
        engineerStatuses.length > 1 &&
        randomIndex === previousIndex
      );

      previousIndex = randomIndex;

      const status = engineerStatuses[randomIndex];

      document.getElementById("statusEmoji").textContent =
        status.emoji;

      document.getElementById("statusText").textContent =
        status.text;

      document.getElementById("statusLabel").textContent =
        status.label;
    }
  </script>

</body>
</html>
